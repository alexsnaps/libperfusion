[package]
name = "libperfusion"
version = "0.1.0"
edition = "2024"
description = "A pure Rust port of libinjection, which detects SQL injection and cross-site scripting"
license = "BSD-3-Clause"
keywords = ["libinjection", "sqli", "xss", "sql-injection", "waf"]
# The tests come with 28 MB of files vendored from libinjection, which the
# benchmark runs on as well.
exclude = ["/benches", "/tests"]

[lib]
# `cargo bench` is for benches/speed.rs, not for running the unit tests.
bench = false

[dependencies]
# For the byte searches of src/bytes.rs. Without its `std` feature, so that
# this crate goes on needing neither `std` nor an allocator, unless its own
# `std` feature asks for it.
memchr = { version = "2.7", default-features = false }

[features]
# Has memchr find out at run time whether an x86-64 processor has AVX2, and
# search with it, which shows in the SQL detection on long inputs. Off by
# default, as it needs `std` and nothing else here does.
std = ["memchr/std"]
# Exposes implementation details to this crate's own tests. Not part of the
# API: anything behind it can change in any release.
internals = []

[dev-dependencies]
# Turns `internals` on for the tests, and only for them.
libperfusion = { path = ".", features = ["internals"] }

[[bench]]
name = "speed"
harness = false
